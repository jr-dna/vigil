name: Vigil

options:
  bundleIdPrefix: music.jordanalegant
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Vigil:
    type: application
    platform: macOS
    sources:
      # Resources is excluded here and added by the entry below. Including it
      # in both would put Vigil.icns in Copy Bundle Resources twice, which the
      # build system rejects ("multiple commands produce"). It never came up
      # before 0.3.3 only because the .icns didn't exist yet when XcodeGen ran.
      - path: Sources
        excludes:
          - "Resources/**"
          - "Bridging/Vigil-Bridging-Header.h"
      - path: Sources/Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: Vigil
        PRODUCT_BUNDLE_IDENTIFIER: music.jordanalegant.vigil
        INFOPLIST_FILE: Sources/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/Bridging/Vigil-Bridging-Header.h
        MARKETING_VERSION: "0.3.3"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Automatic
        # Vigil reads its own process table and sends signals to processes
        # owned by the current user. Neither needs an entitlement, but both
        # are blocked by App Sandbox — leave sandboxing off.
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - sdk: IOKit.framework
      - sdk: AppKit.framework
